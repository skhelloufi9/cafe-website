name: Lint

on:
  pull_request:
    # run lint for PRs targeting main or from feature branches
    branches:
      - main
      - 'features/*'
  push:
    # run lint on pushes to main and feature branches
    branches:
      - main
      - 'features/*'

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run eslint
        run: npm run lint
